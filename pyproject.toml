[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "langharmess-core"
version = "0.1.0"
description = "Plugin-driven LangChain agent on Pelix/iPOPO"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pelix>=3.2.2",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
strict = false

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = [
    "langharmess_core",
    "langharmess_plugin",
    "langharmess_api",
    "langharmess_cli",
]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
precision = 2
